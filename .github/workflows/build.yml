name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build && make -C build
      - uses: actions/upload-artifact@v4
        with:
          name: nativ_sync
          path: build/nativ_sync.vpk
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: protocol code
        run: |
          mkdir -p build
          cc -O2 -Wall -Werror -Icommon -Ithird_party/monocypher tests/host/proto_test.c common/nsync_proto.c third_party/monocypher/monocypher.c -o build/proto_test
          build/proto_test
      - name: screens render
        run: cc -O2 -Wall -Ikernel tools/preview.c kernel/draw.c kernel/screens.c kernel/font.c -o build/preview && (cd build && ./preview)
  # a version tag (vX.Y.Z): a draft release with the vpk, published by hand once Nativ's release goes out with it
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [vpk, host]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nativ_sync
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" nativ_sync.vpk --repo "${GITHUB_REPOSITORY}" --draft --title "Nativ Sync ${GITHUB_REF_NAME#v}" --notes "Install nativ_sync.vpk, open Nativ Sync, Settings, Install the background service, and restart. Then pair from Nativ: Settings, Vita sync."
